name: drift

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/autonomy-logic
  BUILDX_BUILDER: autonomy
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy

      - name: Set up the builder
        run: scripts/setup-builder.sh

      - name: Check the drift
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          scripts/drift-check.sh "$REGISTRY" "$RUNNER_TEMP/drift"

      - name: Write the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/drift/report.md" ]; then
            cat "$RUNNER_TEMP/drift/report.md" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drift-report
          path: |
            ${{ runner.temp }}/drift/report.md
            ${{ runner.temp }}/drift/action-needed
            ${{ runner.temp }}/drift/scan
          if-no-files-found: error
          retention-days: 90

  issue:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/drift-issue.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/drift-issue.sh "$RUNNER_TEMP/drift"
